# Copilot coding agent'ın geçici ortamını çalışmaya başlamadan önce hazırlar:
# burada kurulan bağımlılıklar her agent koşusunda hazır olur.
# Default branch'e merge et; Actions sekmesinden test et (workflow_dispatch).
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x" # TODO(confirm): deponun gerçek sürümü
      - run: dotnet restore # TODO(confirm): solution kökte değilse yolu
