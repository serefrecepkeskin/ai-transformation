# Commit-time gate for a workspace that holds no application code. The point
# here is not lint — it is golden rule #2: no customer data and no secret ever
# lands in a task file, the catalog or a commit.
#
#   pip install pre-commit && pre-commit install   # once, per clone
#   pre-commit run --all-files                     # full sweep

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # A private key committed from a research session is the failure this
      # workspace is most exposed to.
      - id: detect-private-key
      # A large file here is almost always a query result dump — exactly what
      # rule #2 forbids. The limit is deliberately low so it asks a question.
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
