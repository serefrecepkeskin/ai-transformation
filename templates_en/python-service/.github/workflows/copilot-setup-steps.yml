# Prepares the Copilot coding agent's ephemeral environment before it starts
# working: dependencies installed here are available to every agent run.
# Merge to the default branch; test it from the Actions tab (workflow_dispatch).
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5 # TODO(confirm): uv / poetry / pip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # TODO(confirm): match the repo's real version
      - run: uv sync --dev # TODO(confirm): the repo's real install command
