# Copilot coding agent'ın geçici ortamını çalışmaya başlamadan önce hazırlar:
# burada kurulan bağımlılıklar her agent koşusunda hazır olur.
# Default branch'e merge et; Actions sekmesinden test et (workflow_dispatch).
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # TODO(confirm): deponun gerçek Node sürümü
          cache: npm # TODO(confirm): npm / pnpm / yarn
      - run: npm ci # TODO(confirm): deponun gerçek kurulum komutu
