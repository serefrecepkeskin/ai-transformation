# Prepares the Copilot coding agent's ephemeral environment before it starts
# working: dependencies installed here are available to every agent run.
# Merge to the default branch; test it from the Actions tab (workflow_dispatch).
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x" # TODO(confirm): match the repo's real version
      - run: dotnet restore # TODO(confirm): solution path if not repo root
